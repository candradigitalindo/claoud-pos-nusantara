services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: cloud_pos
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-webhook-secret}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-secret-token}
      RATE_LIMIT_PER_MINUTE: 100
      # Penarikan angka medsos keluar lewat alamat ini bila diisi. Instagram dan
      # TikTok memblokir pembacaan anonim dari alamat datacenter, jadi tanpa
      # proxy penarikannya pasti gagal dan angkanya harus diisi tangan lewat
      # halaman Kinerja Medsos. Isi di .env, lalu `docker compose up -d app`.
      SOCIAL_PROXY_URL: ${SOCIAL_PROXY_URL:-}
      # Gateway WhatsApp (layanan `wa` di bawah). Token sama dengan milik gateway.
      WA_GATEWAY_URL: http://wa:4100
      WA_GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:-wa-gateway-secret}
    volumes:
      - uploads_data:/app/uploads
      # Kredensial Google Drive milik host, read-only. Remote "gdrive:" inilah
      # yang juga dipakai cron backup database harian.
      - ${HOME}/.config/rclone/rclone.conf:/etc/rclone/rclone.conf:ro
    depends_on:
      db:
        condition: service_healthy

  # Gateway WhatsApp gratis (whatsmeow, protokol WhatsApp Web). Sesi disimpan
  # di database yang sama (tabel whatsmeow_*) sehingga ikut backup harian dan
  # tidak hilang saat container dibuat ulang. Tidak dipublikasikan ke luar:
  # hanya `app` yang memanggilnya lewat jaringan internal compose.
  wa:
    build:
      context: .
      target: wa-gateway
    restart: unless-stopped
    environment:
      PORT: 4100
      TZ: Asia/Jakarta
      WA_GATEWAY_TOKEN: ${WA_GATEWAY_TOKEN:-wa-gateway-secret}
      WA_DB_DSN: postgres://postgres:postgres@db:5432/cloud_pos?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  postgres_data:
  uploads_data:

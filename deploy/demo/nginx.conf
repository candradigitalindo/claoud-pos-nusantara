# Web lingkungan DEMO (demo.nbp.co.id).
#
# Dipasang menimpa /etc/nginx/conf.d/default.conf di image nginx RILIS yang
# sedang diuji: berkas UI-nya sama persis dengan yang kelak naik ke produksi,
# hanya konfigurasi ini yang berbeda. Lalu lintas datang dari nginx produksi
# lewat jaringan docker `nbp-edge`.
#
# ATURAN: upstream API selalu alias "demo-app", JANGAN "app" (nama API
# produksi). Resolusi nama saat permintaan datang (resolver + variabel), jadi
# app demo yang dibuat ulang langsung terjangkau tanpa me-restart web ini.

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 200m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo_api http://demo-app:4000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Demo tidak boleh terindeks mesin pencari: pelanggan sungguhan bisa
    # tersesat ke halaman menu/reservasi demo dan memesan di sana.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-NBP-Environment "demo" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── Penanda DEMO di setiap halaman ───────────────────────────────────────
    # Bingkai oranye di tepi layar, label di tepi atas, judul tab berawalan
    # "[DEMO]". Tidak menghalangi klik (pointer-events: none). Label ikut
    # tercetak supaya kertas dari demo tidak tertukar dengan dokumen asli.
    sub_filter_once on;
    sub_filter '</head>' '<meta name="robots" content="noindex,nofollow"><style id="nbp-demo-css">#nbp-demo-frame{position:fixed;top:0;right:0;bottom:0;left:0;border:3px solid #f59e0b;pointer-events:none;z-index:2147483646}#nbp-demo-badge{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:2147483647;pointer-events:none;background:#f59e0b;color:#3a2400;font:700 11px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em;padding:2px 12px 3px;border-radius:0 0 8px 8px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.18)}@media (max-width:640px){#nbp-demo-badge .nbp-demo-long{display:none}#nbp-demo-badge{font-size:9px;line-height:1;padding:2px 8px}}@media print{#nbp-demo-frame{display:none}#nbp-demo-badge{box-shadow:none}}</style><script>(function(){var p="[DEMO] ";function f(){if(document.title.indexOf(p)!==0){document.title=p+document.title}}f();try{new MutationObserver(f).observe(document.head,{subtree:true,childList:true,characterData:true})}catch(e){}})();</script></head>';
    sub_filter '</body>' '<div id="nbp-demo-frame" aria-hidden="true"></div><div id="nbp-demo-badge" role="note">DEMO<span class="nbp-demo-long"> &middot; data latihan, terpisah dari produksi</span></div></body>';

    # ── API demo ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         $demo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 10s;
        client_body_timeout   300s;
        proxy_request_buffering off;
        proxy_buffering    off;
    }

    location ^~ /cctv/ {
        proxy_pass $demo_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-NBP-Environment "demo" always;
    }

    location /uploads/ {
        proxy_pass       $demo_api;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # ── UI ───────────────────────────────────────────────────────────────────
    location /assets/ {
        root  /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-NBP-Environment "demo" always;
    }

    location = /index.html {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-NBP-Environment "demo" always;
        expires off;
    }

    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

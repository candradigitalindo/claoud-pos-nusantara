# Lingkungan DEMO — demo.nbp.co.id
#
# Salinan utuh aplikasi produksi untuk latihan pengguna dan uji rilis sebelum
# naik ke produksi. Jalankan HANYA lewat deploy/demo.sh (skrip itu yang mengisi
# variabel DEMO_* dari folder keadaan demo di luar repo); tanpa variabel itu
# compose sengaja menolak jalan.
#
# Isolasi dari produksi:
#   - basis data, berkas unggahan, dan dokumen sendiri (volume cloud-pos-demo_*)
#   - rahasia sendiri (JWT, webhook, token admin, kunci kamera)
#   - jaringan `internal` TANPA akses internet: demo tidak mungkin mengirim
#     WhatsApp, menarik medsos, memanggil AI, mengunggah ke Google Drive, atau
#     menjangkau kamera, walau pengaturan di basis datanya menyala
#   - tidak ada port yang dibuka ke host; satu-satunya pintu masuk adalah
#     nginx produksi → jaringan `nbp-edge` → web demo
#   - batas memori & CPU supaya demo tidak pernah merebut sumber daya produksi
#     (server 8 GB tanpa swap)
#
# Penting: upstream di nginx demo SELALU alias "demo-app"/"demo-db", jangan
# nama layanan polos. "app" dan "db" adalah nama layanan produksi.

name: cloud-pos-demo

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_pos_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?jalankan lewat deploy/demo.sh}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      internal:
        aliases: [demo-db]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloud_pos_demo"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
    cpus: 1.5
    logging: *logging

  app:
    image: ${DEMO_APP_IMAGE:?jalankan lewat deploy/demo.sh}
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: demo-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DEMO_DB_PASSWORD:?jalankan lewat deploy/demo.sh}
      DB_NAME: cloud_pos_demo
      DB_SSLMODE: disable
      JWT_SECRET: ${DEMO_JWT_SECRET:?jalankan lewat deploy/demo.sh}
      WEBHOOK_SECRET: ${DEMO_WEBHOOK_SECRET:?jalankan lewat deploy/demo.sh}
      ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-}
      CAMERA_ENC_KEY: ${DEMO_CAMERA_ENC_KEY:?jalankan lewat deploy/demo.sh}
      RATE_LIMIT_PER_MINUTE: 100
      ANALYTICS_URL: http://demo-analytics:4200
      # Integrasi keluar dikosongkan dengan sengaja (dan tetap tidak akan
      # tersambung karena jaringannya tanpa internet).
      WA_GATEWAY_URL: ""
      WA_GATEWAY_TOKEN: ""
      GO2RTC_URL: http://cctv-demo.invalid:1984
      SOCIAL_PROXY_URL: ""
      NARRATIVE_PROVIDER: ""
      NARRATIVE_BASE_URL: ""
      NARRATIVE_MODEL: ""
      NARRATIVE_API_KEY: ""
      # QRIS mati seperti produksi. Untuk latihan alur QRIS di tablet demo,
      # isi DEMO_PAYMENT_GATEWAY_PROVIDER=mock dan DEMO_PAYMENT_GATEWAY_ALLOW_MOCK=true
      # di demo.env (simulasi murni, tidak menagih uang sungguhan).
      PAYMENT_GATEWAY_PROVIDER: ${DEMO_PAYMENT_GATEWAY_PROVIDER:-}
      PAYMENT_GATEWAY_ALLOW_MOCK: ${DEMO_PAYMENT_GATEWAY_ALLOW_MOCK:-}
    volumes:
      - uploads:/app/uploads
      - documents:/app/private/documents
    networks:
      internal:
        aliases: [demo-app]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 2
    logging: *logging

  analytics:
    image: ${DEMO_ANALYTICS_IMAGE:-cloud-pos-analytics:latest}
    restart: unless-stopped
    networks:
      internal:
        aliases: [demo-analytics]
    mem_limit: 384m
    cpus: 1
    logging: *logging

  web:
    image: ${DEMO_WEB_IMAGE:?jalankan lewat deploy/demo.sh}
    restart: unless-stopped
    volumes:
      # Salinan deploy/demo/nginx.conf di folder keadaan demo (ditulis ulang
      # oleh deploy/demo.sh setiap kali demo dinyalakan), menimpa konfigurasi
      # produksi bawaan image. UI-nya tetap UI rilis yang sedang diuji.
      - ${DEMO_NGINX_CONF:?jalankan lewat deploy/demo.sh}:/etc/nginx/conf.d/default.conf:ro
    networks:
      internal: {}
      edge:
        aliases: [demo-web]
    depends_on:
      - app
    mem_limit: 128m
    cpus: 1
    logging: *logging

networks:
  internal:
    internal: true
  edge:
    name: nbp-edge
    external: true

volumes:
  db_data:
  uploads:
  documents:

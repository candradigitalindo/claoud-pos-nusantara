# Semua traffic masuk ke pos.nbp.co.id
# /api/v1/* dan /uploads/* → Go app
# /* → Vue SPA

server {
    listen 80;
    server_name pos.nbp.co.id;

    client_max_body_size 200m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Go API — proxy ke backend
    location /api/ {
        proxy_pass         http://app:4000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;
        client_body_timeout   300s;
        proxy_request_buffering off;
        proxy_buffering    off;
    }

    # CCTV hanya melalui relay Go yang memeriksa akun, outlet, dan sesi HLS.
    location ^~ /cctv/ {
        proxy_pass http://app:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "private, no-store" always;
    }

    # File upload — proxy ke backend
    location /uploads/ {
        proxy_pass       http://app:4000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Hashed assets — cache browser 1 tahun
    location /assets/ {
        root  /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html jangan pernah di-cache (browser/Cloudflare) — ia menunjuk bundle
    # hashed terkini; meng-cache-nya membuat deploy baru tak terlihat sampai
    # hard-refresh manual. Aset hashed di /assets/ tetap immutable.
    location = /index.html {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Vue SPA — semua path lain dikembalikan ke index.html
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# >>> demo.nbp.co.id ──────────────────────────────────────────────────────────
# Lingkungan DEMO (deploy/demo, docs/lingkungan-demo.md): diteruskan apa adanya
# ke web demo lewat jaringan docker `nbp-edge`. Nama "demo-web" di-resolve saat
# permintaan datang (resolver + variabel), jadi nginx produksi tetap menyala
# walau demo mati; pengunjung demo hanya melihat halaman "demo tidak aktif".
# Blok ini juga yang mencegah demo.nbp.co.id jatuh ke server produksi di atas.
server {
    listen 80;
    server_name demo.nbp.co.id;

    client_max_body_size 200m;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $demo_web http://demo-web:80;

    location / {
        proxy_pass         $demo_web;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 5s;
        client_body_timeout   300s;
        proxy_request_buffering off;
        proxy_buffering    off;
    }

    error_page 502 504 = @demo_off;
    location @demo_off {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503 '<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo tidak aktif</title><body style="font:16px/1.5 system-ui,sans-serif;max-width:34rem;margin:15vh auto;padding:0 16px;color:#1f2937"><p style="display:inline-block;background:#f59e0b;color:#3a2400;font-weight:700;font-size:12px;letter-spacing:.06em;padding:2px 10px;border-radius:6px">DEMO</p><h1 style="font-size:1.4rem;margin:.4rem 0">Lingkungan demo sedang tidak aktif</h1><p>Demo sedang disiapkan ulang atau dimatikan sementara. Coba lagi beberapa menit lagi.</p><p style="color:#6b7280">Aplikasi produksi tetap berjalan normal di pos.nbp.co.id.</p></body></html>';
    }
}
# <<< demo.nbp.co.id
